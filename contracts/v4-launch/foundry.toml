[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./assets" }]
remappings = [
  "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
  "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
  "permit2/=node_modules/@uniswap/v4-periphery/lib/permit2/",
  "solmate/=node_modules/@uniswap/v4-periphery/lib/v4-core/lib/solmate/",
  "forge-std/=node_modules/@uniswap/v4-periphery/lib/v4-core/lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@uniswap/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 64

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
mainnet = "${ETH_RPC_URL}"
